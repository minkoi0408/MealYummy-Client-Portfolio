server {
    listen 80;
    server_name mealyummy.io.vn www.mealyummy.io.vn api.mealyummy.io.vn;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://mealyummy.io.vn$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mealyummy.io.vn;
    client_max_body_size 50m;

    ssl_certificate     /etc/letsencrypt/live/mealyummy.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mealyummy.io.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8082;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
