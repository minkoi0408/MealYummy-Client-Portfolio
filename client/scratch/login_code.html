<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700;800;900&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .glass-card {
            background: rgba(26, 31, 46, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-lime {
            box-shadow: 0 0 20px rgba(163, 230, 53, 0.2);
        }
        .text-glow {
            text-shadow: 0 0 10px rgba(163, 230, 53, 0.4);
        }
        .rim-light {
            border: 1px solid transparent;
            background-image: linear-gradient(rgba(15, 17, 23, 1), rgba(15, 17, 23, 1)), radial-gradient(circle at top left, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0));
            background-origin: border-box;
            background-clip: padding-box, border-box;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#32362a",
                        "primary": "#ccff80",
                        "surface-container-low": "#191d12",
                        "on-secondary-fixed": "#00210c",
                        "inverse-primary": "#446900",
                        "surface-bright": "#363b2e",
                        "error-container": "#93000a",
                        "tertiary-fixed": "#dee2f7",
                        "tertiary-container": "#ced2e6",
                        "secondary": "#4de082",
                        "surface": "#11150a",
                        "surface-dim": "#11150a",
                        "outline-variant": "#424936",
                        "on-primary-fixed": "#121f00",
                        "inverse-surface": "#e0e4d2",
                        "on-tertiary": "#2b3040",
                        "error": "#ffb4ab",
                        "surface-container-lowest": "#0b1006",
                        "secondary-container": "#00b55d",
                        "background": "#11150a",
                        "on-primary-container": "#416400",
                        "on-error-container": "#ffdad6",
                        "primary-fixed": "#b2f746",
                        "on-secondary": "#003919",
                        "primary-container": "#a3e635",
                        "on-surface-variant": "#c2cab0",
                        "on-primary": "#213600",
                        "outline": "#8c947c",
                        "primary-fixed-dim": "#98da27",
                        "on-tertiary-container": "#555a6b",
                        "on-primary-fixed-variant": "#334f00",
                        "on-background": "#e0e4d2",
                        "tertiary-fixed-dim": "#c1c6da",
                        "on-secondary-container": "#003e1c",
                        "tertiary": "#eceeff",
                        "surface-container-highest": "#32362a",
                        "surface-container-high": "#272c1f",
                        "on-secondary-fixed-variant": "#005227",
                        "secondary-fixed-dim": "#4de082",
                        "surface-tint": "#98da27",
                        "surface-container": "#1d2116",
                        "secondary-fixed": "#6dfe9c",
                        "inverse-on-surface": "#2e3226",
                        "on-error": "#690005",
                        "on-tertiary-fixed-variant": "#414657",
                        "on-surface": "#e0e4d2",
                        "on-tertiary-fixed": "#161b2a"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "12px",
                        "xl": "64px",
                        "xs": "4px",
                        "md": "24px",
                        "lg": "40px",
                        "container-margin": "20px",
                        "base": "8px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Lexend"],
                        "label-caps": ["Space Grotesk"],
                        "body-md": ["Lexend"],
                        "body-lg": ["Lexend"],
                        "display-xl": ["Lexend"],
                        "headline-md": ["Lexend"],
                        "button-text": ["Lexend"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", {"lineHeight": "1.2", "fontWeight": "600"}],
                        "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "display-xl": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "button-text": ["16px", {"lineHeight": "1", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#0f1117] text-on-background font-body-md min-h-screen overflow-x-hidden">
<main class="min-h-screen flex flex-col md:flex-row">
<!-- LEFT SIDE: Branding & Visuals -->
<section class="hidden md:flex flex-1 relative bg-gradient-to-br from-[#0f1a0a] via-[#1a2e0f] to-[#0f1117] flex-col justify-between p-lg">
<div class="z-10 mt-xl">
<h1 class="font-display-xl text-display-xl text-white mb-md">Chào mừng quay trở lại!</h1>
<p class="font-body-lg text-body-lg text-slate-400 max-w-md">Đăng nhập để tiếp tục hành trình dinh dưỡng của bạn.</p>
</div>
<div class="absolute inset-0 flex items-center justify-center opacity-80 pointer-events-none">
<img class="w-[80%] max-w-2xl drop-shadow-[0_0_50px_rgba(163,230,53,0.3)]" data-alt="A hyper-realistic 3D salad bowl with vibrant kale, radishes, and grilled chicken floating in zero gravity. The bowl is surrounded by a neon lime green aura and glowing light particles against a deep obsidian and dark green gradient background. High-contrast lighting emphasizes the fresh textures of the floating ingredients in a futuristic, cinematic bio-hacking style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBPEuzw-2nMmSPRgRvGbz5ETP61QXdrG3youIUJ0ECbUuLZ3kEg5sH_0wKvHnQnutcxcTzLqyOVQgWeXUTTm3IjICBlxg3IQehcX2xfrqIy56yiZS20xo5t-74yog01TzAgiU_3RKoBmhw0R5LaPwAoGnRXAUJ04Uizb2SGPmfSyKyDRTcarT6Hov4uWcN2WX8GlGq0yK52fuCr8DWjG9MkIPxPkZZdnYL6nYzEXw7McZfD2GR6GaYuGMOpXYFYmoNGqmF0mwfnFsSq"/>
</div>
<!-- Stats Bar -->
<div class="z-10 grid grid-cols-3 gap-md bg-[#1a1f2e]/40 backdrop-blur-md rounded-lg p-md rim-light max-w-2xl">
<div class="text-center">
<span class="block font-headline-md text-headline-md bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">10,000+</span>
<span class="font-label-caps text-label-caps text-slate-400">VĐV TIN DÙNG</span>
</div>
<div class="text-center border-x border-white/10">
<span class="block font-headline-md text-headline-md bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">500+</span>
<span class="font-label-caps text-label-caps text-slate-400">CÔNG THỨC</span>
</div>
<div class="text-center">
<span class="block font-headline-md text-headline-md bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">4.9★</span>
<span class="font-label-caps text-label-caps text-slate-400">ĐÁNH GIÁ</span>
</div>
</div>
</section>
<!-- RIGHT SIDE: Login Form -->
<section class="flex-1 flex flex-col items-center justify-center p-container-margin relative min-h-screen">
<!-- Background Glows -->
<div class="absolute top-1/4 right-0 w-96 h-96 bg-primary/10 blur-[120px] rounded-full"></div>
<div class="absolute bottom-1/4 left-0 w-64 h-64 bg-secondary/5 blur-[100px] rounded-full"></div>
<div class="w-full max-w-md z-10 space-y-md">
<!-- Brand Logo -->
<div class="flex justify-center mb-xl">
<img alt="MealYummy Logo" class="h-12 w-auto" data-alt="A sleek and modern minimalist logo for MealYummy featuring an abstract lime green sprout and a stylized spoon. The logo is rendered in a high-tech vector style with clean lines and high contrast against a dark background. It conveys a sense of premium nutrition, health-conscious performance, and futuristic digital wellness." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA0OSqCiuDl2Q7hj6p0FmNQ_wk5JVMKSEOpXbDGS69Kd980o-R6xHTmjqKZv0-gaxHtFlTZ8cUBEGl3dHC6CcZbPK5czYrJKBt5gkdpgzSD74rgJwvZW9ZhcmdZU3hyQ5S4vK7Yv7rcYVNDuDCcodAcHlcWy78B01YGIbBceIo4Ek1p4lw0r8GiIHjX6YniHr_atfIMMmJB9da3iZedyaCex3licU60tVLAZ788I6GVGvye6sOj6hoiBAvB4qCuNvd2yCnsZZRQnPDS"/>
</div>
<!-- Main Login Card -->
<div class="glass-card rounded-lg p-lg space-y-md rim-light glow-lime">
<div class="text-center space-y-sm">
<h2 class="font-headline-lg text-headline-lg text-white">Đăng nhập 🥗</h2>
<!-- Tab Switcher -->
<div class="flex bg-[#0f1117]/60 rounded-full p-1 border border-white/5">
<button class="flex-1 py-2 font-button-text text-button-text text-slate-500 hover:text-slate-300 transition-colors">Đăng ký</button>
<button class="flex-1 py-2 font-button-text text-button-text bg-primary text-black rounded-full shadow-[0_0_15px_rgba(163,230,53,0.4)]">Đăng nhập</button>
</div>
</div>
<form class="space-y-md">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-slate-400 ml-1">Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">mail</span>
<input class="w-full bg-[#1a2133] border border-white/10 rounded-lg py-4 pl-12 pr-4 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-slate-600" placeholder="example@mealyummy.fit" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-slate-400 ml-1">Mật khẩu</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">lock</span>
<input class="w-full bg-[#1a2133] border border-white/10 rounded-lg py-4 pl-12 pr-12 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-slate-600" placeholder="••••••••" type="password"/>
<button class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white transition-colors" type="button">visibility</button>
</div>
</div>
<!-- Actions Row -->
<div class="flex items-center justify-between">
<label class="flex items-center space-x-2 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-5 h-5 border border-white/20 rounded-md checked:bg-primary transition-all" type="checkbox"/>
<span class="material-symbols-outlined absolute text-[16px] text-black opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<span class="font-body-md text-sm text-slate-400 group-hover:text-slate-300">Ghi nhớ tôi</span>
</label>
<a class="font-body-md text-sm text-primary hover:text-lime-300 transition-colors" href="#">Quên mật khẩu?</a>
</div>
<!-- CTA Button -->
<button class="w-full bg-gradient-to-r from-primary to-secondary py-4 rounded-lg font-button-text text-button-text text-black flex items-center justify-center space-x-2 hover:brightness-110 active:scale-[0.98] transition-all shadow-[0_10px_20px_rgba(163,230,53,0.2)]" type="submit">
<span>Đăng nhập ngay</span>
<span class="material-symbols-outlined" data-weight="fill">auto_awesome</span>
</button>
</form>
<!-- Social Login -->
<div class="space-y-md pt-4">
<div class="relative flex items-center">
<div class="flex-grow border-t border-white/5"></div>
<span class="flex-shrink mx-4 font-label-caps text-label-caps text-slate-600">Hoặc đăng nhập bằng</span>
<div class="flex-grow border-t border-white/5"></div>
</div>
<div class="flex justify-center space-x-md">
<button class="w-14 h-14 flex items-center justify-center glass-card rounded-full hover:border-primary/40 transition-colors group">
<svg class="w-6 h-6 fill-slate-400 group-hover:fill-white transition-colors" viewbox="0 0 24 24">
<path d="M12.48 10.92v3.28h7.84c-.24 1.84-.908 3.152-1.928 4.176-1.228 1.212-3.144 2.348-6.392 2.348-5.128 0-9.252-4.14-9.252-9.252s4.124-9.252 9.252-9.252c2.776 0 4.884 1.092 6.388 2.528l2.316-2.316C18.496 1.056 15.792 0 12.48 0 5.676 0 0 5.676 0 12.48s5.676 12.48 12.48 12.48c3.708 0 6.512-1.212 8.708-3.512 2.272-2.272 2.988-5.46 2.988-8.028 0-.768-.06-1.5-.18-2.208h-11.5v.008z"></path>
</svg>
</button>
<button class="w-14 h-14 flex items-center justify-center glass-card rounded-full hover:border-primary/40 transition-colors group">
<svg class="w-6 h-6 fill-slate-400 group-hover:fill-white transition-colors" viewbox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
</button>
</div>
</div>
</div>
<!-- Footer link -->
<div class="text-center">
<p class="font-body-md text-slate-400">
                        Chưa có tài khoản? 
                        <a class="text-primary font-semibold hover:underline decoration-primary/30 underline-offset-4 transition-all" href="#">Đăng ký ngay</a>
</p>
</div>
</div>
</section>
</main>
</body></html>
