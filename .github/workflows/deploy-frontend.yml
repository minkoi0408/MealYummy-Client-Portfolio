name: Deploy Frontend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy Frontend
        run: |
          VPS_HOST=$(printf '%s' "${{ secrets.VPS_HOST }}" | tr -d '[:space:]')
          VPS_USER=$(printf '%s' "${{ secrets.VPS_USERNAME }}" | tr -d '[:space:]')
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ${VPS_USER}@${VPS_HOST} \
            "cd ~/mealyummy-server/client && git pull origin main && cd .. && docker compose build --no-cache frontend && docker compose up -d frontend && docker image prune -f"
